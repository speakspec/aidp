name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          # Pin to pnpm 10. pnpm 11 enables strict build-script policy
          # (ERR_PNPM_IGNORED_BUILDS) and ignores package.json's
          # onlyBuiltDependencies allow-list under "latest" defaults,
          # which breaks the esbuild postinstall vitepress needs.
          version: 10
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node 22.13+; otherwise pnpm crashes with
          # ERR_UNKNOWN_BUILTIN_MODULE on node:sqlite during startup.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
